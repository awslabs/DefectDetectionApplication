---
RecipeFormatVersion: "2020-01-25"
ComponentName: "aws.edgeml.dda.LocalServer.amd64"
ComponentVersion: "1.0.0"
ComponentDescription: DDA Local Web Server App - AMD64
ComponentPublisher: Amazon
ComponentDependencies:
  aws.greengrass.Nucleus:
    # Align with the arm64/JP5/JP6 recipes (>=2.4.0). Devices are provisioned
    # with Nucleus 2.12.0 by setup_station.sh, so a >=2.13.0 pin here made the
    # amd64 deployment unsatisfiable (thing pinned =2.12.0 vs component >=2.13.0)
    # and Greengrass rejected it with FAILED_NO_STATE_CHANGE. There is no amd64-
    # specific feature that requires a newer Nucleus than the other targets.
    VersionRequirement: ">=2.4.0"
  aws.greengrass.ShadowManager:
    VersionRequirement: ">=2.2.0"
  aws.greengrass.Cli:
    VersionRequirement: ">=2.6.0"
ComponentConfiguration:
  DefaultConfiguration:
    StreamShadowName: "streamConfigurationShadow"
    AppRunnerShadowName: "appRunnerShadow"
    LocalLoginEnabled: "false"
    accessControl:
      aws.greengrass.ShadowManager:
        'aws.edgeml.dda.LocalServer.amd64:shadow:1':
          policyDescription: 'Allows access to shadows'
          operations:
            - 'aws.greengrass#GetThingShadow'
            - 'aws.greengrass#UpdateThingShadow'
          resources:
            - $aws/things/*/shadow
            - $aws/things/*/shadow/name/*
        'aws.edgeml.dda.LocalServer.amd64:shadow:2':
          policyDescription: 'Allows access to things with shadows'
          operations:
            - 'aws.greengrass#ListNamedShadowsForThing'
          resources:
            - '*'
      aws.greengrass.ipc.mqttproxy:
        'aws.edgeml.dda.LocalServer.amd64:mqttproxy:1':
          policyDescription: Allows access to shadow pubsub topics
          operations:
            - "aws.greengrass#SubscribeToIoTCore"
            - "aws.greengrass#PublishToIoTCore"
          resources:
            - $aws/things/*/shadow/name/*
        'aws.edgeml.dda.LocalServer.amd64:mqttproxy:2':
          policyDescription: 'Allows workflow mqtt_publish output publishes: the node topic parameter is free-form user input, so no topic prefix can cover it and publish must be authorized on the wildcard resource. Deliberately publish-only; SubscribeToIoTCore is NOT broadened beyond the shadow topics in mqttproxy:1'
          operations:
            - "aws.greengrass#PublishToIoTCore"
          resources:
            - '*'
      aws.greengrass.Cli:
        'aws.edgeml.dda.LocalServer.amd64:cli:1':
          policyDescription: 'Allows access to restart and stop DDA greengrass components'
          operations:
            - 'aws.greengrass#RestartComponent'
            - 'aws.greengrass#StopComponent'
          resources:
            - 'aws.edgeml.dda.*'
            - 'model*'
        'aws.edgeml.dda.LocalServer.amd64:cli:2':
          policyDescription: 'Allows access to list and get details for greengrass components on device'
          operations:
            - 'aws.greengrass#ListComponents'
            - 'aws.greengrass#GetComponentDetails'
          resources:
            - '*'
Manifests:
  - Platform:
      os: linux
      architecture: amd64
    Lifecycle:
      Install:
        RequiresPrivilege: true
        Script: |
          docker images --quiet --filter=dangling=true | xargs --no-run-if-empty docker rmi -f || true; docker load -i {artifacts:decompressedPath}/aws.edgeml.dda.LocalServer.amd64-x86_64/custom-build/aws.edgeml.dda.LocalServer.amd64/flask-app.tar && docker load -i {artifacts:decompressedPath}/aws.edgeml.dda.LocalServer.amd64-x86_64/custom-build/aws.edgeml.dda.LocalServer.amd64/react-webapp.tar
      # Health-gated lifecycle (edge-deploy-reliability, Defect B): Startup
      # replaces the attached Run. `up -d --wait` exits 0 only when all
      # started services pass their compose healthchecks, so Greengrass
      # reports RUNNING only over a healthy backend; a retried Startup's
      # `compose up` also starts existing stopped containers (the recovery
      # path for a container the restart race managed to kill). Timeout 900s:
      # Greengrass's 120s Startup default is far below a cold device boot.
      # Adoption-proof Startup (Defect E): STARTUP_EPOCH is recorded first;
      # --force-recreate ensures the compose up never adopts a previous
      # incarnation's (possibly still-dying) container; verify-fresh (NOT
      # best-effort) fails Startup non-zero if any project container's
      # StartedAt predates this Startup, so Greengrass retries instead of
      # reporting RUNNING over a stale container.
      Startup:
        RequiresPrivilege: true
        Timeout: 900
        SetEnv:
          COMPONENT_WORK_PATH: "{work:path}"
          KERNEL_ROOT_PATH: "{kernel:rootPath}"
          INFERENCE_COMPONENT_DECOMPRESED_PATH: "{aws.edgeml.dda.InferenceApp:artifacts:decompressedPath}"
          LOCAL_SERVER_COMPONENT_DECOMPRESSED_PATH: "{artifacts:decompressedPath}/aws.edgeml.dda.LocalServer.amd64-x86_64"
        Script: |
          STARTUP_EPOCH=$(date +%s)
          bash {artifacts:decompressedPath}/aws.edgeml.dda.LocalServer.amd64-x86_64/custom-build/aws.edgeml.dda.LocalServer.amd64/host_scripts/setup_dda_users.sh ;
          bash {artifacts:decompressedPath}/aws.edgeml.dda.LocalServer.amd64-x86_64/custom-build/aws.edgeml.dda.LocalServer.amd64/host_scripts/get_nvidia_libs_versions.sh;
          bash {artifacts:decompressedPath}/aws.edgeml.dda.LocalServer.amd64-x86_64/custom-build/aws.edgeml.dda.LocalServer.amd64/host_scripts/setup_paths.sh;
          bash {artifacts:decompressedPath}/aws.edgeml.dda.LocalServer.amd64-x86_64/custom-build/aws.edgeml.dda.LocalServer.amd64/host_scripts/configure_usb.sh;
          export $(grep -v '^#' /tmp/.dda.env | xargs) ;
          docker compose --profile $DOCKER_PROFILE -f {artifacts:decompressedPath}/aws.edgeml.dda.LocalServer.amd64-x86_64/custom-build/aws.edgeml.dda.LocalServer.amd64/docker-compose.yaml up -d --no-build --force-recreate --wait --wait-timeout 600 ;
          bash {artifacts:decompressedPath}/aws.edgeml.dda.LocalServer.amd64-x86_64/custom-build/aws.edgeml.dda.LocalServer.amd64/host_scripts/compose_lifecycle.sh verify-fresh $STARTUP_EPOCH -- --profile $DOCKER_PROFILE -f {artifacts:decompressedPath}/aws.edgeml.dda.LocalServer.amd64-x86_64/custom-build/aws.edgeml.dda.LocalServer.amd64/docker-compose.yaml
      # Shutdown exports /tmp/.dda.env the same way Startup does: Greengrass
      # gives Shutdown a fresh environment, so without the export
      # $DOCKER_PROFILE expanded empty and `--profile` consumed `-f`, making
      # every `docker compose down` fail with "no configuration file
      # provided: not found". ${DOCKER_PROFILE:-generic} keeps the down
      # working even if /tmp/.dda.env is missing (generic is what
      # get_nvidia_libs_versions.sh selects on non-tegra targets).
      # Synchronous teardown (edge-deploy-reliability, Defect E): after the
      # down, wait-empty blocks (bounded, best-effort) until the project
      # reports zero containers, so Shutdown does not return while a
      # slow-dying backend still exists for the next Startup to adopt.
      # Timeout 300s: Greengrass's 15s default would truncate the wait; 300
      # covers the 120s stop grace plus the dying window with margin, and
      # sits above the 240s wait bound.
      Shutdown:
        RequiresPrivilege: true
        Timeout: 300
        Script: |
          export $(grep -v '^#' /tmp/.dda.env | xargs) || true
          docker compose --profile ${DOCKER_PROFILE:-generic} -f {artifacts:decompressedPath}/aws.edgeml.dda.LocalServer.amd64-x86_64/custom-build/aws.edgeml.dda.LocalServer.amd64/docker-compose.yaml down
          bash {artifacts:decompressedPath}/aws.edgeml.dda.LocalServer.amd64-x86_64/custom-build/aws.edgeml.dda.LocalServer.amd64/host_scripts/compose_lifecycle.sh wait-empty 240 -- --profile ${DOCKER_PROFILE:-generic} -f {artifacts:decompressedPath}/aws.edgeml.dda.LocalServer.amd64-x86_64/custom-build/aws.edgeml.dda.LocalServer.amd64/docker-compose.yaml || true
    Artifacts:
      - URI: s3://BUCKET_NAME/COMPONENT_NAME/COMPONENT_VERSION/aws.edgeml.dda.LocalServer.amd64-x86_64.zip
        Unarchive: ZIP