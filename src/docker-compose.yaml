version: "3.0"
services:
  backend_tegra_gpu_enabled:
    network_mode: "host"
    # Auto-recover from crashes. The backend links to the Greengrass Nucleus
    # over the AWS CRT event-stream RPC IPC, which can hit a native fatal abort
    # ("Continuation ref count has gone negative" in aws-c-event-stream) that
    # SIGABRTs the whole process. Without a restart policy that abort leaves the
    # flask-app permanently down until the component is manually restarted.
    # `unless-stopped` re-launches the container after such a crash while the
    # Greengrass component is running, and does not fight the component's own
    # `docker compose down` on a normal stop (which removes the container).
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
      args:
        OS: ${OS:-20.04}
        PLATFORM: ${PLATFORM:-aarch64}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
        ONNXRUNTIME_SPEC: ${ONNXRUNTIME_SPEC:-onnxruntime==1.16.3}
        ONNXRUNTIME_GPU: ${ONNXRUNTIME_GPU:-0}
    image: flask-app
    platform: linux/arm64/v8
    privileged: true
    expose:
      - "5000"
      - "5443"
    volumes:
      - /aws_dda:/aws_dda
      - /tmp:/tmp
      - /dev/shm:/dev/shm
      - /usr/local/cuda:/usr/local/cuda/
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /var/run/dbus:/var/run/dbus:ro
      - /dev:/dev
    environment:
      - OS=$OS
      - DDA_SYSTEM_USER_ID=$DDA_SYSTEM_USER_ID
      - DDA_SYSTEM_GROUP_ID=$DDA_SYSTEM_GROUP_ID
      - DDA_ADMIN_USER_ID=$DDA_ADMIN_USER_ID
      - DDA_ADMIN_GROUP_ID=$DDA_ADMIN_GROUP_ID
      - AWS_REGION
      - SVCUID
      - AWS_GG_NUCLEUS_DOMAIN_SOCKET_FILEPATH_FOR_COMPONENT
      - AWS_CONTAINER_AUTHORIZATION_TOKEN
      - AWS_CONTAINER_CREDENTIALS_FULL_URI
      - AWS_IOT_THING_NAME
      - COMPONENT_WORK_PATH
      - KERNEL_ROOT_PATH
      - INFERENCE_COMPONENT_DECOMPRESED_PATH
      - LOCAL_SERVER_COMPONENT_DECOMPRESSED_PATH
      - JETSON_CUDA=$JETSON_CUDA
      - JETSON_TENSORRT=$JETSON_TENSORRT
      # Request GPU capabilities so the L4T NVIDIA Container Runtime performs its
      # CSV injection (host-files-for-container.d/*.csv, incl. tensorrt.csv ->
      # libnvinfer.so.8.2.1). Without these, `runtime: nvidia` injects nothing
      # from the CSVs, so libnvinfer.so* (which lives in /usr/lib/aarch64-linux-gnu,
      # NOT the tegra/ dir we bind-mount) is absent in the container and the
      # python+DLR base_model fails: "libnvinfer.so.8: cannot open shared object
      # file". CUDA still works via the explicit mounts below, which masks the gap.
      # Requires /etc/nvidia-container-runtime/config.toml mode = "csv" on JP4/L4T r32.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - CUDA_HOME=/usr/local/cuda/
      # /usr/local/cuda-12.6/... leads the path on JP6 ONLY (the dir does not
      # exist in JP4/JP5 images, where the loader silently skips it): the JP6
      # image's /usr/local/cuda is a real mount-point dir (not a symlink), so
      # the host CUDA mount above no longer shadows the image's cuda-12.6
      # toolkit, and torch/vllm (built against CUDA 12.6) must resolve the
      # 12.6 runtime libs rather than an older host toolkit (JetPack 6.0's
      # 12.2 libcudart lacks cudaGetDriverEntryPointByVersion -> model-load
      # failures). Driver libs (libcuda.so.1, libnvrm*) are NOT in the toolkit
      # lib dir — they come from the tegra dir / NVIDIA runtime injection — so
      # the host driver still wins for driver resolution.
      # /opt/dda/trt8-runtime/lib is appended LAST (lowest precedence) for the
      # JetPack 6 Neo/DLR TensorRT 8 stack (Dockerfile.jp6 stages TRT 8.5 there
      # because JP6 ships TRT 10). TensorRT dlopens libnvinfer_builder_resource.
      # so.8.5.2 by BARE filename, which searches only LD_LIBRARY_PATH + default
      # paths — not the ldconfig-registered custom dir — so the staged dir must
      # be on LD_LIBRARY_PATH for the DLR model to load. Its .so.8/.so.11 sonames
      # do not collide with the base image's TRT 10 / cuDNN 9 / cuBLAS 12, and
      # being last it cannot shadow the cuda-12.6 libs torch/vLLM resolve first.
      # On JP4/JP5 the dir does not exist (TRT 8 is native under /usr/lib), so the
      # loader silently skips it — harmless.
      - LD_LIBRARY_PATH=/usr/local/cuda-12.6/targets/aarch64-linux/lib/:$LD_LIBRARY_PATH:$CUDA_HOME/lib64/:/usr/lib/aarch64-linux-gnu/tegra:/usr/local/cuda/targets/aarch64-linux/lib/:/opt/dda/trt8-runtime/lib
      - GRPC_POLL_STRATEGY=poll
      - GRPC_ENABLE_FORK_SUPPORT=1
      - PYTHONPATH=/opt/tritonserver/backends/python:/
      - ARGUS_HEADLESS=1
      - NVARGUS_ENABLE_HEADLESS=1
    # On Jetson/L4T, GPU access is provided by the NVIDIA Container Runtime, not
    # by the Compose `deploy.resources.reservations.devices` (--gpus / CDI)
    # mechanism. The latter invokes the NVIDIA Container Runtime Hook directly,
    # which Jetson does NOT support and fails with:
    #   "invoking the NVIDIA Container Runtime Hook directly ... is not supported.
    #    Please use the NVIDIA Container Runtime instead."
    # `runtime: nvidia` selects the nvidia runtime, which injects the Tegra GPU
    # driver libraries (libcuda.so.1, etc.) into the container.
    runtime: nvidia
    profiles: [tegra]
  backend_generic:
    network_mode: "host"
    # Auto-recover from crashes (see backend_tegra_gpu_enabled above).
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
      args:
        OS: ${OS:-20.04}
        PLATFORM: ${PLATFORM:-x86_64}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
        ONNXRUNTIME_SPEC: ${ONNXRUNTIME_SPEC:-onnxruntime==1.16.3}
        ONNXRUNTIME_GPU: ${ONNXRUNTIME_GPU:-0}
    image: flask-app
    privileged: true
    expose:
      - "5000"
      - "5443"
      - "8000"
      - "8001"
      - "8002"
    volumes:
      - /aws_dda:/aws_dda
      - /tmp:/tmp
      - /dev/shm:/dev/shm
    environment:
      - DDA_SYSTEM_USER_ID=$DDA_SYSTEM_USER_ID
      - DDA_SYSTEM_GROUP_ID=$DDA_SYSTEM_GROUP_ID
      - DDA_ADMIN_USER_ID=$DDA_ADMIN_USER_ID
      - DDA_ADMIN_GROUP_ID=$DDA_ADMIN_GROUP_ID
      - AWS_REGION
      - SVCUID
      - AWS_GG_NUCLEUS_DOMAIN_SOCKET_FILEPATH_FOR_COMPONENT
      - AWS_CONTAINER_AUTHORIZATION_TOKEN
      - AWS_CONTAINER_CREDENTIALS_FULL_URI
      - AWS_IOT_THING_NAME
      - COMPONENT_WORK_PATH
      - KERNEL_ROOT_PATH
      - INFERENCE_COMPONENT_DECOMPRESED_PATH
      - LOCAL_SERVER_COMPONENT_DECOMPRESSED_PATH
      - JETSON_CUDA=$JETSON_CUDA
      - JETSON_TENSORRT=$JETSON_TENSORRT
      - LD_LIBRARY_PATH=$LD_LIBRARY_PATH
      - GRPC_POLL_STRATEGY=poll
      - GRPC_ENABLE_FORK_SUPPORT=1
      - PYTHONPATH=/opt/tritonserver/backends/python:/
    profiles: [generic]
  backend_generic_nvidia:
    # x86_64 hosts with the NVIDIA GPU runtime (AMD64_NVIDIA target,
    # aws.edgeml.dda.LocalServer.amd64Nvidia). Runtime-only service: the
    # flask-app image is built by build-custom.sh through the generic
    # profile's build definition with BACKEND_DOCKERFILE=Dockerfile.x86_64_nvidia
    # (CUDA x86 base + GPU onnxruntime); the recipe runs `up --no-build`
    # against the loaded image with `--profile generic_nvidia`.
    network_mode: "host"
    # Auto-recover from crashes (see backend_tegra_gpu_enabled above).
    restart: unless-stopped
    image: flask-app
    privileged: true
    expose:
      - "5000"
      - "5443"
      - "8000"
      - "8001"
      - "8002"
    volumes:
      - /aws_dda:/aws_dda
      - /tmp:/tmp
      - /dev/shm:/dev/shm
    environment:
      - DDA_SYSTEM_USER_ID=$DDA_SYSTEM_USER_ID
      - DDA_SYSTEM_GROUP_ID=$DDA_SYSTEM_GROUP_ID
      - DDA_ADMIN_USER_ID=$DDA_ADMIN_USER_ID
      - DDA_ADMIN_GROUP_ID=$DDA_ADMIN_GROUP_ID
      - AWS_REGION
      - SVCUID
      - AWS_GG_NUCLEUS_DOMAIN_SOCKET_FILEPATH_FOR_COMPONENT
      - AWS_CONTAINER_AUTHORIZATION_TOKEN
      - AWS_CONTAINER_CREDENTIALS_FULL_URI
      - AWS_IOT_THING_NAME
      - COMPONENT_WORK_PATH
      - KERNEL_ROOT_PATH
      - INFERENCE_COMPONENT_DECOMPRESED_PATH
      - LOCAL_SERVER_COMPONENT_DECOMPRESSED_PATH
      - JETSON_CUDA=$JETSON_CUDA
      - JETSON_TENSORRT=$JETSON_TENSORRT
      # Request GPU capabilities from the NVIDIA Container Toolkit. On x86
      # (unlike Jetson/L4T) the standard Compose device-reservation mechanism
      # below is the supported path; these env vars additionally direct the
      # toolkit to inject all driver libraries (libcuda.so.1 etc.).
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - CUDA_HOME=/usr/local/cuda/
      # The Dockerfile.x86_64_nvidia image ships its own CUDA toolkit under
      # /usr/local/cuda (nvidia/cuda base) — no host CUDA mounts are needed;
      # only the driver libs are injected by the NVIDIA runtime.
      - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/cuda/lib64
      - GRPC_POLL_STRATEGY=poll
      - GRPC_ENABLE_FORK_SUPPORT=1
      - PYTHONPATH=/opt/tritonserver/backends/python:/
    # x86_64 GPU access: docker compose's device-reservation mechanism drives
    # the NVIDIA Container Toolkit (`--gpus all` equivalent). This is the
    # supported mechanism on x86 hosts — the Jetson-only `runtime: nvidia`
    # CSV-injection path (see backend_tegra_gpu_enabled) does not apply here.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: [generic_nvidia]
  frontend:
    build: ./frontend
    image: react-webapp
    # Auto-recover from crashes (see backend_tegra_gpu_enabled above).
    restart: unless-stopped
    ports:
      - "3000:80"
      - "3443:443"
    volumes:
      - /aws_dda:/aws_dda
