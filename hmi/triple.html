<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>IMTS Triple Inspection HMI</title>
    <!--
      API_Base for a DETACHED deployment: set `content` to the LocalServer
      origin (e.g. "http://192.168.8.224:5000", or just a port like "5000" to
      reuse this page's host) when this bundle is NOT served by the
      LocalServer's own /hmi mount. Left empty it means same-origin, which is
      the original behaviour. A `?api=` query parameter overrides it only when
      it names this page's host, a private-network, loopback or link-local IP
      address, a .local or single-label name, or a host listed in
      dda-api-allow-hosts below. Any other host is ignored and the page shows
      a notice naming it.
    -->
    <meta name="dda-api-base" content="" />
    <!--
      More hosts `?api=` may name, comma-separated: exact names or IP
      addresses ("station-01.plant.example"), ".suffix" domains
      (".plant.example" covers that name and every name under it) and IPv4
      CIDRs ("100.64.0.0/10", which is not built in). serve-hmi.sh stamps its
      API_ALLOW_HOSTS here.
    -->
    <meta name="dda-api-allow-hosts" content="" />
  </head>
  <!--
    `data-triple-kiosk` marks this document as the kiosk entry: `main.ts`
    auto-starts the app only for a page carrying it, so importing the module
    elsewhere (the wiring tests) starts nothing.
  -->
  <body data-triple-kiosk="true">
    <div id="app"></div>
    <script type="module" src="/src/triple/main.ts"></script>
  </body>
</html>
