<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>IMTS Triple Inspection HMI</title>
    <!--
      API_Base for a DETACHED deployment: set `content` to the LocalServer
      origin (e.g. "http://192.168.8.224:5000", or just a port like "5000" to
      reuse this page's host) when this bundle is NOT served by the
      LocalServer's own /hmi mount. Left empty it means same-origin, which is
      the original behaviour. The `?api=` query parameter overrides it.
    -->
    <meta name="dda-api-base" content="" />
  </head>
  <!--
    `data-triple-kiosk` marks this document as the kiosk entry: `main.ts`
    auto-starts the app only for a page carrying it, so importing the module
    elsewhere (the wiring tests) starts nothing.
  -->
  <body data-triple-kiosk="true">
    <div id="app"></div>
    <script type="module" src="/src/triple/main.ts"></script>
  </body>
</html>
