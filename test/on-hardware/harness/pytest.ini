[pytest]
# Edge_Test_Harness pytest configuration.
#
# Stage selection (Req 1.4) works through standard pytest markers/keywords, e.g.:
#   pytest test/on-hardware/harness -m "capability" -k vllm
#
# JUnit XML is always emitted so every run produces a machine-readable artifact
# (Req 8.1). The ResultsPlugin (harnesslib/results.py) relocates artifacts into
# the per-run results bundle directory.
addopts = -ra --strict-markers --junitxml=harness-results/junit.xml

markers =
    capability(name): test requires the named Capability_Flag in the selected device profile; skipped with a recorded reason when the profile does not grant it (Req 2.1)
    stage(name): names the harness Test_Stage a test belongs to, for results grouping and pytest -m selection
